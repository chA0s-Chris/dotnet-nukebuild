name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check rendering
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify rendered Dockerfiles
        run: ./scripts/check-render.sh

      - name: Enumerate images
        id: images
        run: |
          images="$(./scripts/list-images.sh)"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.image.config }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render Dockerfile
        env:
          IMAGE_CONFIG: ${{ matrix.image.config }}
        run: |
          mkdir -p tmp/context
          ./scripts/render-dockerfile.sh "images/${IMAGE_CONFIG}" > tmp/context/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tmp/context
          push: false

  result:
    name: CI result
    needs:
      - check
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "${CHECK}" != success ] || [ "${BUILD}" != success ]; then
            echo "check: ${CHECK}, build: ${BUILD}" >&2
            exit 1
          fi
